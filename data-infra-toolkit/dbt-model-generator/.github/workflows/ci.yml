name: CI

on:
  push:
    paths:
      - "data-infra-toolkit/dbt-model-generator/**"
  pull_request:
    paths:
      - "data-infra-toolkit/dbt-model-generator/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-infra-toolkit/dbt-model-generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: python -c "from app import parse_create_table; assert len(parse_create_table('CREATE TABLE t (id INT PRIMARY KEY);')) == 1"
