name: CI

on:
  push:
    paths:
      - 'data-infra-toolkit/gx-config-generator/**'
  pull_request:
    paths:
      - 'data-infra-toolkit/gx-config-generator/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r data-infra-toolkit/gx-config-generator/requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check --select E,F,I data-infra-toolkit/gx-config-generator/
      - name: Syntax check
        run: |
          python -c "import py_compile; py_compile.compile('data-infra-toolkit/gx-config-generator/app.py', doraise=True)"
          python -c "import py_compile; py_compile.compile('data-infra-toolkit/gx-config-generator/profiler.py', doraise=True)"
