name: warehouse-cost-attribution CI
on:
  push:
    paths: ["data-engineering-pro/warehouse-cost-attribution/**"]
  pull_request:
    paths: ["data-engineering-pro/warehouse-cost-attribution/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-engineering-pro/warehouse-cost-attribution
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest matplotlib numpy pandas scipy ruff
      - run: ruff check costs.py evidence.py make_chart.py app.py build_notebook.py
      - run: python -m pytest test_costs.py -q
      - run: python evidence.py
