name: sort-order-drift CI
on:
  push:
    paths: ["data-engineering-pro/sort-order-drift/**"]
  pull_request:
    paths: ["data-engineering-pro/sort-order-drift/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-engineering-pro/sort-order-drift
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest matplotlib numpy pandas ruff
      - run: ruff check collate.py evidence.py make_chart.py app.py
      - run: python -m pytest test_collate.py -q
      - run: python evidence.py
