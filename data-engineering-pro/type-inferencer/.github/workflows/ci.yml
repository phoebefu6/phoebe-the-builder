name: type-inferencer CI

on:
  push:
    paths: ["data-engineering-pro/type-inferencer/**"]
  pull_request:
    paths: ["data-engineering-pro/type-inferencer/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-engineering-pro/type-inferencer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check type_infer.py app.py make_chart.py --select E9,F
      - name: Inference must be lossless on the demo corpus
        run: python test_lossless.py
