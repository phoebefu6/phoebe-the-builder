name: CI

on:
  push:
    paths:
      - 'data-engineering-pro/data-contract-validator/**'
  pull_request:
    paths:
      - 'data-engineering-pro/data-contract-validator/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-engineering-pro/data-contract-validator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check . --line-length=120 || true
