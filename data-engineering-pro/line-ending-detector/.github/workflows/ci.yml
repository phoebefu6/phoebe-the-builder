name: line-ending-detector CI
on:
  push:
    paths: ["data-engineering-pro/line-ending-detector/**"]
  pull_request:
    paths: ["data-engineering-pro/line-ending-detector/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-engineering-pro/line-ending-detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest matplotlib numpy pandas ruff
      - run: ruff check lineends.py evidence.py make_chart.py app.py
      - run: python -m pytest test_lineends.py -q
      - run: python evidence.py
