name: ci

on:
  push:
    paths: ['data-engineering-pro/number-parser-locale/**']
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: data-engineering-pro/number-parser-locale

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: python -m pytest test_numlocale.py -q
      - run: python evidence.py > /dev/null
