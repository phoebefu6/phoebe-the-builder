name: CI

on:
  push:
    paths:
      - 'ai-agent-workshop/agent-eval-dashboard/**'
  pull_request:
    paths:
      - 'ai-agent-workshop/agent-eval-dashboard/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-agent-workshop/agent-eval-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check . --line-length=120 || true
