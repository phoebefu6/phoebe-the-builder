# The evidence run is mostly print() of interpolated results, so its source
# lines are long where the OUTPUT lines are not - wrapping them would split
# f-strings mid-sentence and make the prose harder to edit than to read. 110
# columns is the width at which none of them need splitting; everything else
# is held to the default rules.
line-length = 110

[lint.per-file-ignores]
"demo.ipynb" = ["E702", "E501"]
"build_notebook.py" = ["E501"]
