name: percent-recomputer CI
on:
  push:
    paths: ["analytics-engineering-bi/percent-recomputer/**"]
  pull_request:
    paths: ["analytics-engineering-bi/percent-recomputer/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-engineering-bi/percent-recomputer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest matplotlib numpy pandas ruff
      - run: ruff check percentages.py evidence.py make_chart.py app.py build_notebook.py
      - run: python -m pytest test_percentages.py -q
      - run: python evidence.py
