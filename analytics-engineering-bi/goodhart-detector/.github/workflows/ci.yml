name: goodhart-detector CI
on:
  push:
    paths: ["analytics-engineering-bi/goodhart-detector/**"]
  pull_request:
    paths: ["analytics-engineering-bi/goodhart-detector/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-engineering-bi/goodhart-detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest matplotlib numpy pandas scipy ruff
      - run: ruff check goodhart.py evidence.py make_chart.py app.py build_notebook.py
      - run: python -m pytest test_goodhart.py -q
      - run: python evidence.py
