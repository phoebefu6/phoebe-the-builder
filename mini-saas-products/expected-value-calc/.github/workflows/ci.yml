name: expected-value-calc CI

on:
  push:
    paths:
      - 'mini-saas-products/expected-value-calc/**'
  pull_request:
    paths:
      - 'mini-saas-products/expected-value-calc/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-saas-products/expected-value-calc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: python -m pytest -q
      - run: python evidence.py > /dev/null
