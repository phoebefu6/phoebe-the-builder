name: cost-of-delay CI

on:
  push:
    paths: ['mini-saas-products/cost-of-delay/**']
  pull_request:
    paths: ['mini-saas-products/cost-of-delay/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-saas-products/cost-of-delay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check . --select E9,F63,F7,F82
      - name: Every README number is asserted
        run: python -m pytest test_codelay.py -q
      - name: Evidence script runs clean
        run: python evidence.py > /dev/null
