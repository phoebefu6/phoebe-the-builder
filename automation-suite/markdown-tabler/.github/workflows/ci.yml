name: markdown-tabler CI

on:
  push:
    paths: ["automation-suite/markdown-tabler/**"]
  pull_request:
    paths: ["automation-suite/markdown-tabler/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation-suite/markdown-tabler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check . --select E9,F63,F7,F82
      - name: Tests
        run: python3 test_tabler.py
      - name: Evidence runs clean
        run: python3 evidence.py > /dev/null
