# Example GitHub Actions workflow - drop this into a TARGET repo at
# .github/workflows/auto-readme.yml to auto-open a docs PR on every push.
#
# It scans the checked-out repo, regenerates the README, and opens a pull
# request if anything changed. Set ANTHROPIC_API_KEY as a repo secret to use
# Claude; without it the deterministic template is used.

name: Auto-README

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install auto-readme
        run: pip install anthropic

      - name: Generate README
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          curl -sO https://raw.githubusercontent.com/phoebefu6/phoebe-the-builder/main/automation-suite/auto-readme/scanner.py
          curl -sO https://raw.githubusercontent.com/phoebefu6/phoebe-the-builder/main/automation-suite/auto-readme/generator.py
          curl -sO https://raw.githubusercontent.com/phoebefu6/phoebe-the-builder/main/automation-suite/auto-readme/main.py
          python main.py . --llm -o README.md
          rm scanner.py generator.py main.py

      - name: Open PR with updated README
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: regenerate README via auto-readme"
          title: "docs: auto-update README"
          branch: auto-readme/update
          body: "Automated README refresh by auto-readme."
