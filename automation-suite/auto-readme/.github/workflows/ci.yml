name: CI

on:
  push:
    paths:
      - 'automation-suite/auto-readme/**'
  pull_request:
    paths:
      - 'automation-suite/auto-readme/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r automation-suite/auto-readme/requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check --select E,F,I automation-suite/auto-readme/
      - name: Syntax check
        run: |
          python -c "import py_compile; py_compile.compile('automation-suite/auto-readme/main.py', doraise=True)"
          python -c "import py_compile; py_compile.compile('automation-suite/auto-readme/scanner.py', doraise=True)"
          python -c "import py_compile; py_compile.compile('automation-suite/auto-readme/generator.py', doraise=True)"
      - name: Smoke test (offline template)
        run: |
          cd automation-suite/auto-readme
          python main.py . | grep -q "# auto-readme"
