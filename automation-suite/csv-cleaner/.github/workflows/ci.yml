name: CI

on:
  push:
    paths:
      - 'automation-suite/csv-cleaner/**'
  pull_request:
    paths:
      - 'automation-suite/csv-cleaner/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r automation-suite/csv-cleaner/requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check --select E,F,I automation-suite/csv-cleaner/
      - name: Syntax check
        run: |
          python -c "import py_compile; py_compile.compile('automation-suite/csv-cleaner/main.py', doraise=True)"
          python -c "import py_compile; py_compile.compile('automation-suite/csv-cleaner/cleaner.py', doraise=True)"
      - name: Smoke test
        run: |
          cd automation-suite/csv-cleaner
          python main.py --demo
