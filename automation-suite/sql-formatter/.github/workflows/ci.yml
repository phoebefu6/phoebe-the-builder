name: CI

on:
  push:
    paths:
      - 'automation-suite/sql-formatter/**'
  pull_request:
    paths:
      - 'automation-suite/sql-formatter/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r automation-suite/sql-formatter/requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check --select E,F,I automation-suite/sql-formatter/
      - name: Syntax check
        run: |
          python -c "import py_compile; py_compile.compile('automation-suite/sql-formatter/api.py', doraise=True)"
          python -c "import py_compile; py_compile.compile('automation-suite/sql-formatter/formatter.py', doraise=True)"
      - name: Smoke test
        run: |
          cd automation-suite/sql-formatter
          python -c "
          from formatter import analyze
          a = analyze('delete from users')
          assert a['error_count'] == 1, a
          assert 'DELETE' in a['formatted'].upper()
          print('ok')"
