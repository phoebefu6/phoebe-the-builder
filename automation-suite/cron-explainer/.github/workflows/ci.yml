name: cron-explainer CI

on:
  push:
    paths: ['automation-suite/cron-explainer/**']
  pull_request:
    paths: ['automation-suite/cron-explainer/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation-suite/cron-explainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check . --select E9,F63,F7,F82
      - name: Tests
        run: python -m pytest test_cron.py -q
      - name: Evidence still reproduces
        run: python evidence.py
