name: CI

on:
  push:
    paths:
      - 'automation-suite/log-parser/**'
  pull_request:
    paths:
      - 'automation-suite/log-parser/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r automation-suite/log-parser/requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check --select E,F,I automation-suite/log-parser/
      - name: Syntax check
        run: |
          python -c "import py_compile; py_compile.compile('automation-suite/log-parser/app.py', doraise=True)"
          python -c "import py_compile; py_compile.compile('automation-suite/log-parser/parser.py', doraise=True)"
      - name: Smoke test
        run: |
          cd automation-suite/log-parser
          python -c "
          from parser import parse_lines, evaluate_rules, AlertRule
          recs = parse_lines(['2026-06-20 10:00:00 ERROR db timeout','2026-06-20 10:00:01 ERROR db timeout'])
          res = evaluate_rules(recs, [AlertRule('t','ERROR',2,'timeout')])[0]
          assert res['fired'] is True, res
          print('ok')"
