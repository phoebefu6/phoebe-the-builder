name: CI

on:
  push:
    paths:
      - 'automation-suite/duplicate-finder/**'
  pull_request:
    paths:
      - 'automation-suite/duplicate-finder/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r automation-suite/duplicate-finder/requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check --select E,F,I automation-suite/duplicate-finder/
      - name: Syntax check
        run: |
          python -c "import py_compile; py_compile.compile('automation-suite/duplicate-finder/main.py', doraise=True)"
          python -c "import py_compile; py_compile.compile('automation-suite/duplicate-finder/finder.py', doraise=True)"
      - name: Smoke test
        run: |
          cd automation-suite/duplicate-finder
          python -c "
          from main import _make_demo
          from finder import find_duplicates, summarize
          g = find_duplicates(_make_demo())
          s = summarize(g)
          assert s['duplicate_groups'] == 2, s
          assert s['redundant_files'] == 3, s
          print('ok')"
