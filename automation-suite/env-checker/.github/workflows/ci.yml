name: CI

on:
  push:
    paths:
      - 'automation-suite/env-checker/**'
  pull_request:
    paths:
      - 'automation-suite/env-checker/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r automation-suite/env-checker/requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check --select E,F,I automation-suite/env-checker/
      - name: Syntax check
        run: |
          python -c "import py_compile; py_compile.compile('automation-suite/env-checker/main.py', doraise=True)"
          python -c "import py_compile; py_compile.compile('automation-suite/env-checker/checker.py', doraise=True)"
      - name: Smoke test (demo should fail with exit 1)
        run: |
          cd automation-suite/env-checker
          if python main.py --demo; then echo "expected non-zero exit" && exit 1; else echo "correctly failed broken env"; fi
