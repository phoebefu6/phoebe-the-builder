name: CI

on:
  push:
    paths:
      - 'automation-suite/json-validator/**'
  pull_request:
    paths:
      - 'automation-suite/json-validator/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r automation-suite/json-validator/requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check --select E,F,I automation-suite/json-validator/
      - name: Syntax check
        run: |
          python -c "import py_compile; py_compile.compile('automation-suite/json-validator/api.py', doraise=True)"
          python -c "import py_compile; py_compile.compile('automation-suite/json-validator/validator.py', doraise=True)"
      - name: Smoke test
        run: |
          cd automation-suite/json-validator
          python -c "from validator import validate_payload; r=validate_payload({'type':'object','required':['id']}, {}); assert r['valid'] is False; print('ok')"
