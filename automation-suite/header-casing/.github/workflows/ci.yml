name: header-casing CI
on:
  push:
    paths: ["automation-suite/header-casing/**"]
  pull_request:
    paths: ["automation-suite/header-casing/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation-suite/header-casing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest matplotlib numpy pandas ruff
      - run: ruff check headers.py evidence.py make_chart.py app.py
      - run: python -m pytest test_headers.py -q
      - run: python evidence.py
