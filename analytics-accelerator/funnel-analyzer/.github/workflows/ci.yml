name: CI

on:
  push:
    paths:
      - 'analytics-accelerator/funnel-analyzer/**'
  pull_request:
    paths:
      - 'analytics-accelerator/funnel-analyzer/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r analytics-accelerator/funnel-analyzer/requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check --select E,F,I analytics-accelerator/funnel-analyzer/
      - name: Syntax check
        run: |
          python -c "import py_compile; py_compile.compile('analytics-accelerator/funnel-analyzer/app.py', doraise=True)"
          python -c "import py_compile; py_compile.compile('analytics-accelerator/funnel-analyzer/funnel.py', doraise=True)"
      - name: Smoke test
        run: |
          cd analytics-accelerator/funnel-analyzer
          python -c "
          from funnel import sample_events, compute_funnel, compute_funnel_by_segment, steps_to_frame, DEFAULT_STEPS
          ev = sample_events()
          res = compute_funnel(ev, DEFAULT_STEPS)
          users = [s.users for s in res.steps]
          assert users == sorted(users, reverse=True)  # monotonic funnel
          assert res.steps[0].users == 2000
          assert res.biggest_drop == 'checkout'
          assert 0 <= res.overall_conversion <= 100
          seg = compute_funnel_by_segment(ev, DEFAULT_STEPS, 'device')
          assert seg.by_segment['desktop'] > seg.by_segment['mobile']
          assert len(steps_to_frame(res)) == 5
          print('ok')"
