name: CI

on:
  push:
    paths:
      - 'analytics-accelerator/cohort-analysis/**'
  pull_request:
    paths:
      - 'analytics-accelerator/cohort-analysis/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r analytics-accelerator/cohort-analysis/requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check --select E,F,I analytics-accelerator/cohort-analysis/
      - name: Syntax check
        run: |
          python -c "import py_compile; py_compile.compile('analytics-accelerator/cohort-analysis/app.py', doraise=True)"
          python -c "import py_compile; py_compile.compile('analytics-accelerator/cohort-analysis/cohort.py', doraise=True)"
      - name: Smoke test
        run: |
          cd analytics-accelerator/cohort-analysis
          python -c "
          from cohort import generate_sample_events, build_retention_matrix
          events = generate_sample_events()
          retention = build_retention_matrix(events)
          assert retention.iloc[0, 0] == 100.0
          assert retention.shape[0] > 1
          print('ok')"
