name: CI

on:
  push:
    paths:
      - 'analytics-accelerator/survey-analyzer/**'
  pull_request:
    paths:
      - 'analytics-accelerator/survey-analyzer/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r analytics-accelerator/survey-analyzer/requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check --select E,F,I analytics-accelerator/survey-analyzer/
      - name: Syntax check
        run: |
          python -c "import py_compile; py_compile.compile('analytics-accelerator/survey-analyzer/app.py', doraise=True)"
          python -c "import py_compile; py_compile.compile('analytics-accelerator/survey-analyzer/survey.py', doraise=True)"
      - name: Smoke test
        run: |
          cd analytics-accelerator/survey-analyzer
          python -c "
          from survey import analyze_survey, sample_survey, detect_question_type, compute_nps, NPS, OPEN_TEXT
          df = sample_survey()
          rep = analyze_survey(df)
          assert rep.n_respondents == 120
          assert rep.nps is not None
          nps, bd = compute_nps(df.iloc[:, 0])
          assert bd['promoters'] + bd['passives'] + bd['detractors'] == 120
          assert detect_question_type(df['What can we improve?']) == OPEN_TEXT
          print('ok')"
