name: CI

on:
  push:
    paths:
      - 'analytics-accelerator/ab-test-calc/**'
  pull_request:
    paths:
      - 'analytics-accelerator/ab-test-calc/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r analytics-accelerator/ab-test-calc/requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check --select E,F,I analytics-accelerator/ab-test-calc/
      - name: Syntax check
        run: |
          python -c "import py_compile; py_compile.compile('analytics-accelerator/ab-test-calc/app.py', doraise=True)"
          python -c "import py_compile; py_compile.compile('analytics-accelerator/ab-test-calc/abtest.py', doraise=True)"
      - name: Smoke test
        run: |
          cd analytics-accelerator/ab-test-calc
          python -c "
          from abtest import run_ab_test, required_sample_size
          assert run_ab_test(5000,500,5000,620).significant is True
          assert run_ab_test(5000,500,5000,505).significant is False
          assert required_sample_size(0.10,0.02) > 1000
          print('ok')"
