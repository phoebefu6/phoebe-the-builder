name: CI

on:
  push:
    paths:
      - 'analytics-accelerator/data-quality-scorecard/**'
  pull_request:
    paths:
      - 'analytics-accelerator/data-quality-scorecard/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r analytics-accelerator/data-quality-scorecard/requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check --select E,F,I analytics-accelerator/data-quality-scorecard/
      - name: Syntax check
        run: |
          python -c "import py_compile; py_compile.compile('analytics-accelerator/data-quality-scorecard/app.py', doraise=True)"
          python -c "import py_compile; py_compile.compile('analytics-accelerator/data-quality-scorecard/quality.py', doraise=True)"
      - name: Smoke test
        run: |
          cd analytics-accelerator/data-quality-scorecard
          python -c "
          import warnings; warnings.filterwarnings('ignore')
          from quality import sample_dirty_data, score_dataframe, checks_to_frame, WEIGHTS
          import pandas as pd
          df = sample_dirty_data()
          card = score_dataframe(df)
          assert 0 <= card.overall <= 100
          assert card.grade in {'A','B','C','D','F'}
          assert set(card.dimension_scores) == set(WEIGHTS)
          assert len(card.issues) > 0  # sample has planted issues
          # A clean frame should score higher than the dirty one
          clean = pd.DataFrame({'a':[1,2,3,4,5],'b':[10,20,30,40,50]})
          assert score_dataframe(clean).overall > card.overall
          assert not checks_to_frame(card).empty
          print('ok')"
