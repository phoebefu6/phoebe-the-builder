name: CI

on:
  push:
    paths:
      - 'analytics-accelerator/sales-forecast/**'
  pull_request:
    paths:
      - 'analytics-accelerator/sales-forecast/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r analytics-accelerator/sales-forecast/requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check --select E,F,I analytics-accelerator/sales-forecast/
      - name: Syntax check
        run: |
          python -c "import py_compile; py_compile.compile('analytics-accelerator/sales-forecast/app.py', doraise=True)"
          python -c "import py_compile; py_compile.compile('analytics-accelerator/sales-forecast/forecast.py', doraise=True)"
      - name: Smoke test
        run: |
          cd analytics-accelerator/sales-forecast
          python -c "
          import warnings; warnings.filterwarnings('ignore')
          from forecast import sample_sales, forecast_sales, prepare_series
          df = sample_sales()
          assert len(df) == 36
          series, freq = prepare_series(df)
          assert freq.upper().startswith('M')
          res = forecast_sales(df, periods=12)
          assert len(res.forecast) == 12
          assert res.seasonal_periods == 12
          assert (res.forecast['yhat_upper'] >= res.forecast['yhat_lower']).all()
          assert res.metrics['mape_pct'] is not None and res.metrics['mape_pct'] < 25
          print('ok')"
