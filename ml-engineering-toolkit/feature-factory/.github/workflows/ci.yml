name: CI

on:
  push:
    paths:
      - "ml-engineering-toolkit/feature-factory/**"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-engineering-toolkit/feature-factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff scikit-learn pandas numpy
      - run: ruff check . || true
      - run: python -c "from factory import make_sample_data, infer_plan, fit_transform; df=make_sample_data(); p=infer_plan(df, target='churned'); X,_=fit_transform(df,p); assert X.isna().sum().sum()==0 and X.shape[1] > df.shape[1]-3; print('smoke ok', X.shape)"
