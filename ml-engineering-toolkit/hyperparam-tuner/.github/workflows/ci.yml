name: CI

on:
  push:
    paths:
      - "ml-engineering-toolkit/hyperparam-tuner/**"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-engineering-toolkit/hyperparam-tuner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff scikit-learn pandas numpy optuna
      - run: ruff check . || true
      - run: python -c "from tuner import make_sample_data, tune; df=make_sample_data(); r=tune(df, target='churned', n_trials=8); assert r['best_score'] >= r['default_score'] and 0.4 < r['best_score'] <= 1.0 and len(r['best_params'])==4; print('smoke ok lift', round(r['lift'],4))"
