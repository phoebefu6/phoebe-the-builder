name: CI

on:
  push:
    paths:
      - "ml-engineering-toolkit/model-card-gen/**"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-engineering-toolkit/model-card-gen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff scikit-learn pandas numpy
      - run: ruff check . || true
      - run: python -c "from model_card import demo_train, generate_model_card; m,X,y,r=demo_train(); c=generate_model_card(m,X,y,model_name='T',intended_use='u',slices=r,slice_name='region'); assert '# Model Card' in c and 'Performance by Slice' in c and 'RandomForestClassifier' in c; print('smoke ok')"
