name: CI

on:
  push:
    paths:
      - "ml-engineering-toolkit/calibration-checker/**"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-engineering-toolkit/calibration-checker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff scikit-learn pandas numpy
      - run: ruff check . || true
      - run: python -c "from calibration import demo_data, fit_models, evaluate; a,b,c,d=demo_data(); m=fit_models(a,c); t=evaluate(m,b,d); assert 'brier' in t.columns and 'ece' in t.columns and len(t)==3; print('smoke ok')"
