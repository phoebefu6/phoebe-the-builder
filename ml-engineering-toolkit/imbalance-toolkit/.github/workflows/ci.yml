name: CI

on:
  push:
    paths:
      - "ml-engineering-toolkit/imbalance-toolkit/**"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-engineering-toolkit/imbalance-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff scikit-learn imbalanced-learn pandas numpy
      - run: ruff check . || true
      - run: python -c "from imbalance import make_sample_data, compare_strategies, recommend; df=make_sample_data(); b,_=compare_strategies(df, target='is_fraud'); assert b.shape[0]>=3 and b.iloc[0]['recall'] >= b.loc['Baseline','recall']; print('smoke ok:', recommend(b))"
