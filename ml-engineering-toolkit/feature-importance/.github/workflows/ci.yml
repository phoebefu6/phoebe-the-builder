name: CI

on:
  push:
    paths:
      - "ml-engineering-toolkit/feature-importance/**"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-engineering-toolkit/feature-importance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff scikit-learn pandas numpy
      - run: ruff check . || true
      - run: python -c "from importance import demo_data, train_model, explain; X,y=demo_data(); m,a,b,c,d=train_model(X,y); r=explain(m,a,c,b,d); assert r['n_features']==8 and r['baseline_auc']>0.8 and (r['n_trusted']+r['n_noise']+r['n_review'])==8; print('smoke ok')"
