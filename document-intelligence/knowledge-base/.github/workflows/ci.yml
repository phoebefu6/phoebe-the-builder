name: CI

on:
  push:
    paths:
      - "document-intelligence/knowledge-base/**"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: document-intelligence/knowledge-base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Smoke test KB
        run: |
          python -c "from kb import KnowledgeBase, SAMPLE_DOCS; kb = KnowledgeBase(); [kb.add_document(n, t) for n, t in SAMPLE_DOCS.items()]; a = kb.ask('how do I roll back a deploy?'); assert a.sources and 'deploys.md' in a.sources, a.sources; print('OK cited', a.sources)"
