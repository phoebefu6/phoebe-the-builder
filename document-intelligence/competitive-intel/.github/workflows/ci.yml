name: CI

on:
  push:
    paths:
      - "document-intelligence/competitive-intel/**"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: document-intelligence/competitive-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Smoke test intel report
        run: |
          python -c "from intel import summarize_competitors, SAMPLE_COMPETITORS; r = summarize_competitors(SAMPLE_COMPETITORS); assert r.feature_matrix and r.takeaways, 'empty report'; print('OK', len(r.competitors), 'profiles', len(r.feature_matrix), 'features')"
