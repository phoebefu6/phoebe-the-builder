name: CI

on:
  push:
    paths:
      - "document-intelligence/data-dict-gen/**"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: document-intelligence/data-dict-gen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: pip install ruff pandas
      - name: Lint
        run: ruff check .
      - name: Smoke test dictionary
        run: |
          python -c "from dictgen import generate_dictionary, sample_dataframe; d = generate_dictionary(sample_dataframe()); assert len(d) == 7, len(d); assert any(c.is_pii for c in d), 'no PII flagged'; print('OK', len(d), 'columns documented')"
