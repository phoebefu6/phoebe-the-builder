name: CI

on:
  push:
    paths:
      - "document-intelligence/resume-screener/**"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: document-intelligence/resume-screener
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Smoke test screener
        run: |
          python -c "from screener import screen_resume, SAMPLE_JOB, SAMPLE_RESUMES; r = screen_resume(SAMPLE_RESUMES['Strong fit'], SAMPLE_JOB); assert r.score > 70, r.score; print('OK score', r.score)"
