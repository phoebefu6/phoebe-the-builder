name: CI

on:
  push:
    paths:
      - "document-intelligence/contract-extractor/**"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: document-intelligence/contract-extractor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Smoke test heuristic review
        run: |
          pip install -r requirements.txt
          python -c "from extractor import review_contract, SAMPLE_CONTRACT; r = review_contract(SAMPLE_CONTRACT); assert r.clauses, 'no clauses'; print('OK', len(r.clauses), 'clauses')"
