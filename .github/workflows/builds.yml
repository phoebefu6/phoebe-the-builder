# Runs the test suite of every build directory a push actually touched.
#
# Until 2026-09-06 each build shipped its own .github/workflows/ci.yml inside its
# own folder.  GitHub only reads workflows from the repository root, so all 108 of
# them had never run - not once, across 168 builds.  They looked like CI and were
# decorative.  This file replaces them.  See _build-log/2026-09-06-ci-tombstone.md.
name: Build tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changed-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 0 = full history, so a multi-commit push can be diffed against its
          # true base.  Depth 2 only ever showed the last commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Work out which build directories changed
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            # github.event.before is the tip BEFORE this push, so a push of several
            # commits is diffed as a whole.  HEAD^ was wrong here and silently
            # covered only the last commit - the first two runs of this workflow
            # tested nothing and went green.  All-zeros means a new branch.
            before="${{ github.event.before }}"
            case "$before" in
              ""|0000000000000000000000000000000000000000) before="" ;;
            esac
            if [ -n "$before" ]; then
              git fetch --no-tags --depth=50 origin "$before" 2>/dev/null || git fetch --no-tags --unshallow 2>/dev/null || true
              git cat-file -e "$before^{commit}" 2>/dev/null || before=""
            fi
            base="${before:-$(git rev-parse HEAD^ 2>/dev/null || echo '')}"
          fi
          if [ -z "$base" ]; then
            changed="$(git ls-files)"
          else
            changed="$(git diff --name-only "$base" HEAD)"
          fi
          # A build lives at <product-line>/<slug>/, so take the first two segments.
          dirs="$(echo "$changed" | awk -F/ 'NF>=3 {print $1"/"$2}' | sort -u)"
          echo "dirs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$dirs" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "candidate directories:"; echo "$dirs"

      - name: Test them
        env:
          # A normal daily push touches one build.  A repo-wide sweep (a lint pass,
          # a template change) touches all 168, and installing 168 requirements.txt
          # in one job is not a useful signal - it is an hour of pip.  Cap it, and
          # SAY what was skipped rather than reporting green on a partial run.
          MAX_BUILDS: "12"
        run: |
          set -uo pipefail
          ran=0
          failed=0
          skipped=0
          total=$(echo "${{ steps.scope.outputs.dirs }}" | grep -c . || true)
          if [ "$total" -gt "$MAX_BUILDS" ]; then
            echo "::warning::this push touches $total build directories; testing the first $MAX_BUILDS only."
            echo "::warning::the remaining $((total - MAX_BUILDS)) were NOT tested by this run."
          fi
          while IFS= read -r d; do
            [ -n "$d" ] || continue
            [ -d "$d" ] || continue
            ls "$d"/test_*.py >/dev/null 2>&1 || continue
            if [ "$ran" -ge "$MAX_BUILDS" ]; then
              echo "SKIPPED BY CAP, NOT TESTED: $d"
              skipped=$((skipped + 1))
              continue
            fi
            echo "::group::$d"
            ran=$((ran + 1))
            if [ -f "$d/requirements.txt" ]; then
              pip install -q -r "$d/requirements.txt" || { echo "::error::$d deps failed"; failed=$((failed + 1)); echo "::endgroup::"; continue; }
            fi
            # Two harness styles live in this repo and both are legitimate.  A file
            # that defines `def test_...` is a pytest suite; one that does not is a
            # self-running script with its own runner and a non-zero exit on failure
            # (9 of 40 are, and pytest MIS-reports those - it collects a decorator
            # named `test` and errors at setup).  Decide statically, per file.
            for f in "$d"/test_*.py; do
              b="$(basename "$f")"
              if grep -qE '^[[:space:]]*def test_' "$f"; then
                ( cd "$d" && python -m pytest -q "$b" ) || { echo "::error::$d/$b failed (pytest)"; failed=$((failed + 1)); }
              else
                ( cd "$d" && python "$b" ) || { echo "::error::$d/$b failed (self-running)"; failed=$((failed + 1)); }
              fi
            done
            echo "::endgroup::"
          done <<< "${{ steps.scope.outputs.dirs }}"
          echo "ran $ran build suite(s), $failed failed, $skipped skipped by the cap"
          if [ "$skipped" -gt 0 ]; then
            echo "::warning::$skipped build suite(s) were skipped by MAX_BUILDS and are NOT covered by this green tick."
          fi
          [ "$failed" -eq 0 ]
