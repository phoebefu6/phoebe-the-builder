name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # No --select here on purpose.  The rule set, the line length and the
      # exclusions all live in ./ruff.toml so that a local `ruff check` and CI
      # cannot disagree - which is exactly how this job stayed red for months.
      - run: ruff check .
