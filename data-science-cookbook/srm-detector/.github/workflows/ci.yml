name: srm-detector CI

on:
  push:
    paths: ["data-science-cookbook/srm-detector/**"]
  pull_request:
    paths: ["data-science-cookbook/srm-detector/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-science-cookbook/srm-detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: python -m pytest -q test_srm.py
      - run: python evidence.py
